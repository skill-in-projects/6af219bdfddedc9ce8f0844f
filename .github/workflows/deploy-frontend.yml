name: Deploy Frontend to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install and build
        run: |
          npm install
          npm run build
      - name: Add the Skill-in badge
        run: |
          cat > /tmp/skillin-badge.html <<'SKILLIN_BADGE'
          <div id="skillin-badge" style="position:fixed;right:12px;bottom:12px;z-index:2147483647;display:flex;align-items:center;gap:10px;padding:6px 10px;background:#fff;border:1px solid #e2e5eb;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.12);font:12px/1.2 system-ui,sans-serif"><a href="https://skill-in.com/" target="_blank" rel="noopener"><img src="data:image/png;base64," alt="Made with Skill-in" style="height:18px;width:auto;display:block" /></a><a href="mailto:admin@skill-in.com?subject=Report%20abuse%3A%206af219bdfddedc9ce8f0844f" style="color:#6b7280;text-decoration:underline">Report abuse</a></div>
          SKILLIN_BADGE
          python3 - <<'SKILLIN_PY'
          import pathlib, sys
          page = pathlib.Path('dist/index.html')
          html = page.read_text(encoding='utf-8')
          badge = pathlib.Path('/tmp/skillin-badge.html').read_text(encoding='utf-8').strip()
          at = html.lower().rfind('</body>')
          if at < 0: sys.exit('dist/index.html has no </body>: the Skill-in badge was not added')
          page.write_text(html[:at] + badge + html[at:], encoding='utf-8')
          SKILLIN_PY
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
